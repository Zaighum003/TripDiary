name: trip_diary
description: "A personal travel journalling Flutter mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  provider: ^6.1.0
  image_picker: ^1.0.0
  just_audio: ^0.9.36
  record: ^6.2.0
  geolocator: ^11.0.0
  geocoding: ^2.1.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.0
  share_plus: ^7.2.0
  local_auth: ^2.1.6
  flutter_secure_storage: ^9.0.0
  permission_handler: ^11.0.0
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
